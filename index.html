<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">

        <!-- Header -->
        <div class="header">
            <h1>Weather App</h1>

            <button id="darkModeBtn" onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                value="Rajkot"
            >

            <button onclick="searchWeather()">Search</button>
        </div>

        <!-- Current Weather -->
        <div class="current-weather">

            <h2 id="cityName">Rajkot, India</h2>

            <div class="temperature" id="temperature">
                31.6°C
            </div>

            <p>Humidity: <span id="humidity">59</span>%</p>

            <p>Feels like: <span id="feelsLike">36.3</span>°C</p>

            <p>Wind: <span id="wind">16.1</span> km/h</p>

            <p id="weatherDescription">Partly Cloudy</p>

        </div>

      
        <div class="forecast-section">

            <h2>7 Days Forecast</h2>

            <div id="forecastContainer" class="forecast-container">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
